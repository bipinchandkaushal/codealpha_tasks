<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>ShopCentral - Security Gateway</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo" onclick="window.location.href='index.html'">ShopCentral <span>Max</span> 🛒</div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-tabs">
        <h2 id="authTitle">Secure Customer Entry</h2>
        <p style="font-size:12px; color:#6c757d; margin-bottom:20px;">If you don't have an account, fill all fields and press 'Create New Account' first!</p>
      </div>

      <div class="input-group">
        <label>Full Name (Only required for account creation)</label>
        <input type="text" id="username" placeholder="Enter full name for registration">
      </div>

      <div class="input-group">
        <label>Registered Email Address</label>
        <input type="email" id="email" placeholder="name@domain.com">
      </div>

      <div class="input-group">
        <label>Secure Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="main-auth-btn" onclick="handleLogin()">Login Account →</button>
      <div class="divider">OR</div>
      <button class="sec-auth-btn" onclick="handleSignup()">✨ Create New Account (Register)</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
